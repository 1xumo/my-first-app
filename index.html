<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport 让页面在手机上正确缩放、点击变大，这是手机 App 的关键配置 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的待办清单</title>
  <meta name="theme-color" content="#667eea">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    /* ========== 全局样式 ========== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 整个 App 就像一个卡片，在手机上占满宽度，在电脑上居中 */
    .app {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 24px;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #999;
      margin-bottom: 20px;
    }

    /* ========== 输入区 ========== */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-row input {
      flex: 1;
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #667eea;
    }

    .input-row button {
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .input-row button:active {
      transform: scale(0.95);
      background: #5568d3;
    }

    /* ========== 任务列表 ========== */
    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      background: #f8f9fb;
      margin-bottom: 10px;
      animation: pop 0.2s ease;
    }

    @keyframes pop {
      from { transform: scale(0.95); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    /* 圆形的勾选框 */
    li .check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #ccc;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      transition: all 0.2s;
    }

    li.done .check {
      background: #4cd964;
      border-color: #4cd964;
    }

    /* 任务文字 */
    li .text {
      flex: 1;
      font-size: 16px;
      color: #333;
      word-break: break-all;
    }

    li.done .text {
      text-decoration: line-through;
      color: #bbb;
    }

    /* 删除按钮 */
    li .del {
      border: none;
      background: transparent;
      color: #ff5c5c;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0 4px;
    }

    /* 空状态提示 */
    .empty {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      padding: 30px 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>✅ 我的待办清单</h1>
    <p class="subtitle">点击圆圈表示完成，点 ✕ 删除</p>

    <!-- 输入新任务的区域 -->
    <div class="input-row">
      <input id="input" type="text" placeholder="输入要做什么……" maxlength="50">
      <button id="addBtn">添加</button>
    </div>

    <!-- 任务列表会显示在这里 -->
    <ul id="list"></ul>
  </div>

  <script>
    // ========== 逻辑部分 ==========

    // 1. 拿到页面上的元素
    const input   = document.getElementById('input');
    const addBtn  = document.getElementById('addBtn');
    const list    = document.getElementById('list');

    // 2. 任务数据：程序运行时保存在内存里
    //    每个任务是一行 { text: '内容', done: true/false }
    let tasks = [];

    // 3. 从手机/电脑的本地存储里读取之前保存的任务
    //    localStorage 是浏览器自带的“小抽屉”，关掉页面数据也不会丢
    function loadTasks() {
      const saved = localStorage.getItem('tasks');
      if (saved) {
        tasks = JSON.parse(saved);   // 把文字还原成数据
      }
    }

    // 4. 把任务保存进本地存储
    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks)); // 把数据变成文字存起来
    }

    // 5. 把任务显示到页面上（每次改动后都重新画一遍）
    function render() {
      list.innerHTML = '';  // 先清空

      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">还没有任务，添加一个吧 ✍️</div>';
        return;
      }

      tasks.forEach(function(task, index) {
        // 创建一行
        const li = document.createElement('li');
        if (task.done) li.className = 'done';

        // 勾选框
        const check = document.createElement('div');
        check.className = 'check';
        check.textContent = task.done ? '✓' : '';
        check.onclick = function() { toggleDone(index); };

        // 任务文字
        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = task.text;

        // 删除按钮
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.onclick = function() { removeTask(index); };

        li.appendChild(check);
        li.appendChild(text);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    // 6. 添加一个新任务
    function addTask() {
      const text = input.value.trim();   // 去掉首尾空格
      if (text === '') return;           // 空的就不加
      tasks.push({ text: text, done: false });
      input.value = '';                  // 清空输入框
      saveTasks();
      render();
    }

    // 7. 切换「完成 / 未完成」
    function toggleDone(index) {
      tasks[index].done = !tasks[index].done;
      saveTasks();
      render();
    }

    // 8. 删除一个任务
    function removeTask(index) {
      tasks.splice(index, 1);   // 从数组里删掉这一条
      saveTasks();
      render();
    }

    // 9. 绑定事件：点按钮或按回车都能添加
    addBtn.onclick = addTask;
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addTask();
    });

    // 10. 启动：先读取历史任务，再显示
    loadTasks();
    render();

    // 11. 注册离线缓存（让 App 能装到桌面、断网也能打开）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function() { console.log('离线缓存已启用'); })
        .catch(function(err) { console.log('离线缓存注册失败', err); });
    }
  </script>
</body>
</html>
