name: 打包安卓APK

on:
  workflow_dispatch: {}   # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 检查固定签名文件
        run: |
          echo "使用仓库里固定的签名文件 android.keystore"
          keytool -list -v -keystore android.keystore -alias android -storepass android123 | grep -i "SHA256:"

      - name: 安装 Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: 写入 Bubblewrap 配置
        run: |
          mkdir -p ~/.bubblewrap
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: 用 Bubblewrap 打包
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android123
          BUBBLEWRAP_KEY_PASSWORD: android123
        run: printf 'y\n' | bubblewrap build

      - name: 上传 APK、AAB 和签名文件
        uses: actions/upload-artifact@v4
        with:
          name: 待办清单-安装包
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            android.keystore
          if-no-files-found: error
