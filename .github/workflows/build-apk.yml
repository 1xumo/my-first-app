name: 打包安卓APK

on:
  workflow_dispatch: {}   # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Android,OU=Android,O=Android,L=Android,ST=Android,C=US"

      - name: 输出签名指纹（用于安全验证）
        run: |
          echo "===== SHA256 指纹（下面这行冒号分隔的十六进制）====="
          keytool -list -v -keystore android.keystore -alias android -storepass android123 | grep -i "SHA256:"

      - name: 安装 Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: 写入 Bubblewrap 配置
        run: |
          mkdir -p ~/.bubblewrap
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: 用 Bubblewrap 打包
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android123
          BUBBLEWRAP_KEY_PASSWORD: android123
        run: printf 'y\n' | bubblewrap build

      - name: 上传 APK、AAB 和签名文件
        uses: actions/upload-artifact@v4
        with:
          name: 待办清单-安装包
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            android.keystore
          if-no-files-found: error
